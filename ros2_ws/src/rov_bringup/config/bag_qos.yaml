# QoS recordera (ros2 bag record --qos-profile-overrides-path) dla topikow, ktore publikuje kilku wydawcow o roznym QoS
# (rosbridge = TRANSIENT_LOCAL, CLI/wezly = VOLATILE). Bez tego rosbag2 dopasowuje sie do pierwszego wydawcy i GUBI
# wiadomosci od pozostalych. best_effort + volatile jest zgodne z kazdym wydawca; depth duze, zeby nic nie wypadlo.
/rov/cmd_vel_pilot:
  history: keep_last
  depth: 200
  reliability: best_effort
  durability: volatile
/rov/cmd_vel:
